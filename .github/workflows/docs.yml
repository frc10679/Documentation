name: Zensical Documentation

on:
  push:
    branches:
      - '**'

jobs:
  build_and_validate:
    name: Build & Validate
    runs-on: astral/uv:python3.14-trixie
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build Zensical
        run: uvx zensical build --clean

  rtd:
    if: github.ref == 'refs/heads/main' && success()
    name: Trigger Read the Docs
    runs-on: astral/uv:python3.14-trixie
    needs: build_and_validate
    permissions:
      contents: read

    steps:
      - name: API Build Trigger
        run: |
          curl -X POST \
            -H "Authorization: Token ${{ secrets.RTD_TOKEN }}" \
            "https://app.readthedocs.org/api/v3/projects/wirewolves-documentation/versions/latest/builds/"